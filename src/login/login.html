<section id="login">
  <h3>Student Resident Login</h3>
  <form>
    <label>Matric Number:</label><br />
    <input type="text" placeholder="e.g., 22/1045" required /><br /><br />
    <label>Hostel Block:</label><br />
    <select>
      <option>Amethyst Hall</option>
      <option>Emerald Hall</option>
      <option>Sapphire Hall</option>
    </select><br /><br />
    <label>Room Number:</label><br />
    <input type="text" placeholder="e.g., B-104" required /><br /><br />
    <button type="submit">Sign In</button>
  </form>
</section>
