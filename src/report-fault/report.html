<section id="report-fault">
  <h3>Report Hostel Maintenance Fault</h3>
  <form>
    <label>Fault Category:</label><br />
    <select>
      <option>Plumbing</option>
      <option>Electrical</option>
      <option>HVAC / Air Conditioning</option>
      <option>Carpentry</option>
    </select><br /><br />
    <label>Fault Description:</label><br />
    <textarea rows="3" placeholder="Describe the issue..." required></textarea><br /><br />
    <label>Attach Photo Evidence:</label><br />
    <input type="file" accept="image/*" /><br /><br />
    <button type="submit">Submit Repair Ticket</button>
  </form>
</section>
